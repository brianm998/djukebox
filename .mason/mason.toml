# SPDX-License-Identifier: MIT
# Solo fast: explore, develop, fast tests, land directly. For side projects and low risk.
schema = 1
start = "explore"
explored_entry = "develop"

[step.explore]
type = "agent"
category = "exploring"
agent = "light"
next = "develop"

[step.develop]
type = "agent"
category = "developing"
agent = "deep"
budget = "4h"
next = "test"

[step.test]
type = "test"
category = "testing"
suites = ["swift-common", "swift-server", "swift-client"]
max_rounds = 3
on_red = "develop"
next = "land"

[step.land]
type = "landing"
category = "landing"
max_rounds = 3
on_red = "develop"

# A project with suites runs its test step on a node (placement mode "remote"); without them the
# step runs on the coordinator. The "swift" prefix sends each suite to a node with Xcode. No suite
# has a `build` key: the landing batch tier (landing.toml) runs the suites whole over the merged tree.

# Which suites a change needs, in the test step and in the landing batch. A path no glob names
# runs all three. A path two globs name gets both lists, so a README inside a package still runs
# that package's suite.
[impact]
"DJukeboxCommon/**" = ["swift-common", "swift-server", "swift-client"]
"DJukeboxClient/**" = ["swift-client"]
"djukebox_server/**" = ["swift-server"]
"docs/**" = []
"**/*.md" = []
# No suite reads the exit scripts, and nearly every task adds one.
"scripts/exit/**" = []

[suite.swift-common]
command = "swift test --package-path DJukeboxCommon 2>&1"
parser = "swift-testing"
min_tests = 1

[suite.swift-server]
command = "swift test --package-path djukebox_server 2>&1"
parser = "xctest"
min_tests = 1

[suite.swift-client]
command = "swift test --package-path DJukeboxClient 2>&1"
parser = "swift-testing"
min_tests = 1

# MASON files a ticket when the CI workflow (.github/workflows/ci.yml) goes red on develop, and a
# red gate freezes landing until it is green again. Needs a github-actions [ci] section in the
# machine's project file. Agreement and long-red rules are MASON's defaults.
[watch.ci]
enabled = true
gate = "CI"
exclude = []
