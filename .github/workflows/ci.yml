name: CI

# Fast build checks on every push and pull request.
# Does not produce release artifacts — use the Release workflow for that.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Version: the Xcode projects must agree with DJukeboxVersion.current ────
  version:
    name: Version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check MARKETING_VERSION matches scripts/version.sh
        run: |
          V=$(scripts/version.sh)
          status=0
          for P in ios_client/DJukeboxiOS/DJukeboxiOS.xcodeproj/project.pbxproj \
                   mac_client/DJukeboxMac/DJukeboxMac.xcodeproj/project.pbxproj; do
            FOUND=$(sed -n 's/^[[:space:]]*MARKETING_VERSION = "\{0,1\}\([^";]*\)"\{0,1\};.*/\1/p' "$P")
            if [[ -z "$FOUND" ]]; then
              echo "::error file=$P::MARKETING_VERSION is not set"
              status=1
            elif grep -qvxF "$V" <<<"$FOUND"; then
              echo "::error file=$P::MARKETING_VERSION ($(echo $FOUND)) differs from scripts/version.sh ($V)"
              status=1
            fi
          done
          exit $status

  # ── Vapor server: build + test ────────────────────────────────────────────
  server:
    name: Server
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: djukebox_server/.build
          key: ci-server-${{ hashFiles('djukebox_server/Package.resolved') }}
          restore-keys: ci-server-

      - name: Build
        run: swift build
        working-directory: djukebox_server

  # ── DJukeboxCommon Swift package: test ───────────────────────────────────
  common:
    name: DJukeboxCommon
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: DJukeboxCommon/.build
          key: ci-common-${{ hashFiles('DJukeboxCommon/Package.resolved') }}
          restore-keys: ci-common-

      - name: Build
        run: swift build
        working-directory: DJukeboxCommon

  # ── iOS app: build for simulator (no signing) ─────────────────────────────
  ios:
    name: iOS App
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project DJukeboxiOS.xcodeproj \
            -scheme DJukeboxiOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        working-directory: ios_client/DJukeboxiOS

  # ── macOS app: build check (no signing) ──────────────────────────────────
  macos-app:
    name: macOS App
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project DJukeboxMac.xcodeproj \
            -scheme DJukebox \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        working-directory: mac_client/DJukeboxMac
