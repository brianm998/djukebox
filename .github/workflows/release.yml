name: Release

# Triggered by a `v*` tag push (e.g. `git tag v1.0.0 && git push --tags`).
# Can also be run manually via Actions → "Run workflow" to test the pipeline
# without creating a tag — the release-publish job is skipped in that case.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  # ── Resolve the release version once; all other jobs read it ──────────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          else
            V="1.0.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"

  # ── Build the Vapor server as a macOS release binary ─────────────────────
  server:
    name: Server
    runs-on: macos-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: djukebox_server/.build
          key: release-server-${{ hashFiles('djukebox_server/Package.resolved') }}
          restore-keys: release-server-

      - name: Build release binary
        run: swift build -c release
        working-directory: djukebox_server

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp djukebox_server/.build/release/Run dist/djukebox-server
          tar -czf djukebox-server-macos-${{ needs.version.outputs.version }}.tar.gz \
            -C dist djukebox-server

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: djukebox-server-macos-${{ needs.version.outputs.version }}.tar.gz
          if-no-files-found: error

  # ── Build, sign, and export the iOS app ──────────────────────────────────
  ios-app:
    name: iOS App
    runs-on: macos-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      # Import the distribution certificate (same P12 as the macOS Developer ID cert).
      # Gracefully skips if the secret is absent.
      - name: Import certificate
        id: cert
        env:
          P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$P12_B64" ]]; then
            echo "APPLE_CERTIFICATE_P12_BASE64 not set — skipping signing"
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain"
          P12="$RUNNER_TEMP/certs.p12"
          echo "$P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASS" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          echo "has_cert=true" >> "$GITHUB_OUTPUT"

      - name: Stage App Store Connect API key
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:  ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$KEY_B64" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Archive
        env:
          TEAM_ID:   ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project DJukeboxiOS.xcodeproj \
            -scheme DJukeboxiOS \
            -archivePath "$RUNNER_TEMP/DJukeboxiOS.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
        working-directory: ios_client/DJukeboxiOS

      - name: Export .ipa
        env:
          TEAM_ID:   ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DJukeboxiOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Clean up keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -rf "$RUNNER_TEMP/private_keys"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

  # ── Build, sign, notarize, and package the macOS app ─────────────────────
  macos-app:
    name: macOS App
    runs-on: macos-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      # Import Developer ID Application + Installer certs into a throwaway keychain.
      # Gracefully skips (outputs has_cert=false) if the secret is absent.
      - name: Import Developer ID certificate
        id: cert
        env:
          P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$P12_B64" ]]; then
            echo "APPLE_CERTIFICATE_P12_BASE64 not set — ad-hoc signing only"
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain"
          P12="$RUNNER_TEMP/certs.p12"
          echo "$P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASS" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productsign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KC"
          TEAM="${{ secrets.APPLE_TEAM_ID }}"
          APP_N=$(security find-identity -v "$KC" | grep -c "Developer ID Application:.*${TEAM}" || true)
          if [[ "$APP_N" -lt 1 ]]; then
            echo "::error::Missing Developer ID Application identity for team ${TEAM}."
            exit 1
          fi
          rm -f "$P12"
          echo "has_cert=true" >> "$GITHUB_OUTPUT"

      - name: Stage App Store Connect API key
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:  ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$KEY_B64" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Archive
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          TEAM_ID:       ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project DJukeboxMac.xcodeproj \
            -scheme DJukebox \
            -archivePath "$RUNNER_TEMP/DJukeboxMac.xcarchive" \
            -destination 'generic/platform=macOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY"
        working-directory: mac_client/DJukeboxMac

      - name: Export .app
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          TEAM_ID:       ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>${SIGN_IDENTITY}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DJukeboxMac.xcarchive" \
            -exportPath "$RUNNER_TEMP/app" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Notarize .app
        if: steps.cert.outputs.has_cert == 'true'
        env:
          KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          APP=$(find "$RUNNER_TEMP/app" -name "*.app" -maxdepth 1 | head -1)
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/DJukebox-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/DJukebox-notarize.zip" \
            --key      "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            --key-id   "$KEY_ID" \
            --issuer   "$ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"

      - name: Create .dmg
        run: |
          APP=$(find "$RUNNER_TEMP/app" -name "*.app" -maxdepth 1 | head -1)
          VERSION="${{ needs.version.outputs.version }}"
          hdiutil create \
            -volname "DJukebox" \
            -srcfolder "$APP" \
            -ov \
            -format UDZO \
            "DJukebox-${VERSION}.dmg"

      - name: Clean up keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -rf "$RUNNER_TEMP/private_keys"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: DJukebox-${{ needs.version.outputs.version }}.dmg
          if-no-files-found: error

  # ── Publish draft GitHub Release with all artifacts ───────────────────────
  # Skipped on workflow_dispatch (no tag) so you can test the build pipeline
  # without accidentally creating a half-baked release.
  release-publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, server, ios-app, macos-app]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ needs.version.outputs.tag }}
          name:                   DJukebox ${{ needs.version.outputs.version }}
          draft:                  true
          generate_release_notes: true
          files:                  release-artifacts/**/*
