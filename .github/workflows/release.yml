name: Release

# Triggered by a `release/<version>` tag push; run ./release_github.sh to make one.
# The tag must match DJukeboxVersion.current, so bump that first.
# Can also be run manually via Actions → "Run workflow" to test the pipeline
# without creating a tag: it builds, signs, notarizes and uploads the iOS app to
# TestFlight, but the release-publish job is skipped.
#
# The building is done by ./release_darwin.sh, which also runs locally.
# Without the signing secrets a manual run skips the Mac app and iOS upload and
# leaves the server unsigned; a tag run then publishes nothing.

on:
  push:
    tags: ['release/*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional check: must equal scripts/version.sh'
        required: false

permissions:
  contents: read

jobs:
  # ── Resolve the release version once; all other jobs read it ──────────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # scripts/version.sh is the source of truth; a tag or dispatch input is
      # only allowed to agree with it.
      - id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V=$(scripts/version.sh)
          if [[ "$GITHUB_REF" == refs/tags/release/* && "${GITHUB_REF_NAME#release/}" != "$V" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match scripts/version.sh ($V)"
            exit 1
          fi
          if [[ -n "$INPUT_VERSION" && "$INPUT_VERSION" != "$V" ]]; then
            echo "::error::Input version ${INPUT_VERSION} does not match scripts/version.sh ($V)"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=release/$V" >> "$GITHUB_OUTPUT"

  # ── Build and test before spending signing and notarization time ──────────
  check:
    name: Check
    runs-on: macos-15
    needs: version

    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test the server
        run: swift test
        working-directory: djukebox_server

      - name: Test DJukeboxCommon
        run: swift test
        working-directory: DJukeboxCommon

      - name: Build the iOS app (unsigned)
        run: |
          xcodebuild build \
            -project DJukeboxiOS.xcodeproj \
            -scheme DJukeboxiOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        working-directory: ios_client/DJukeboxiOS

      - name: Build the macOS app (unsigned)
        run: |
          xcodebuild build \
            -project DJukeboxMac.xcodeproj \
            -scheme DJukebox \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        working-directory: mac_client/DJukeboxMac

  # ── Server tarball ───────────────────────────────────────────────────────
  server:
    name: Server
    runs-on: macos-15
    needs: [version, check]

    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # .build holds compiler-specific modules, so the cache is per toolchain.
      - name: Toolchain id for the cache key
        id: toolchain
        run: echo "id=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: djukebox_server/.build
          key: release-server-universal-${{ steps.toolchain.outputs.id }}-${{ hashFiles('djukebox_server/Package.resolved') }}
          restore-keys: release-server-universal-${{ steps.toolchain.outputs.id }}-

      - name: Check signing secrets
        id: secrets
        env:
          P12_B64:   ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          TEAM_ID:   ${{ secrets.APPLE_TEAM_ID }}
          KEY_B64:   ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -n "$P12_B64" && -n "$TEAM_ID" && -n "$KEY_B64" && -n "$KEY_ID" && -n "$ISSUER_ID" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SKIP: signing and notarizing the server (Developer ID or API key secrets are missing)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign, notarize and package
        if: steps.secrets.outputs.present == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD:   ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD:            ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID:                ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64:      ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID:             ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID:          ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./release_darwin.sh --server

      # a tag run cannot publish this: the release also needs the signed dmg
      - name: Build and package (unsigned)
        if: steps.secrets.outputs.present != 'true'
        run: ./release_darwin.sh --server --unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/djukebox-server-macos-${{ needs.version.outputs.version }}.tar.gz
          if-no-files-found: error

  # ── Signed, notarized macOS app in a dmg ─────────────────────────────────
  macos-app:
    name: macOS App
    runs-on: macos-15
    needs: [version, check]

    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check signing secrets
        id: secrets
        env:
          P12_B64:   ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          TEAM_ID:   ${{ secrets.APPLE_TEAM_ID }}
          KEY_B64:   ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -n "$P12_B64" && -n "$TEAM_ID" && -n "$KEY_B64" && -n "$KEY_ID" && -n "$ISSUER_ID" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SKIP: the macOS app (Developer ID or API key secrets are missing)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive, sign, notarize and package
        if: steps.secrets.outputs.present == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD:   ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD:            ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID:                ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64:      ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID:             ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID:          ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./release_darwin.sh --mac

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          name: macos-app
          path: dist/DJukebox-${{ needs.version.outputs.version }}.dmg
          if-no-files-found: error

  # ── iOS archive and TestFlight upload ────────────────────────────────────
  # Automatic signing with the App Store Connect API key. The Developer ID
  # certificate is deliberately not given to this job.
  ios-app:
    name: iOS App
    runs-on: macos-15
    needs: [version, check]

    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check App Store Connect secrets
        id: secrets
        env:
          TEAM_ID:   ${{ secrets.APPLE_TEAM_ID }}
          KEY_B64:   ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -n "$TEAM_ID" && -n "$KEY_B64" && -n "$KEY_ID" && -n "$ISSUER_ID" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SKIP: the iOS archive and TestFlight upload (App Store Connect secrets are missing)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive and upload to TestFlight
        if: steps.secrets.outputs.present == 'true'
        env:
          APPLE_TEAM_ID:           ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID:        ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID:     ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./release_darwin.sh --ios

  # ── Publish draft GitHub Release with all artifacts ───────────────────────
  # Only for a pushed tag: a workflow_dispatch run never publishes.
  release-publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release/') && github.event_name == 'push'
    needs: [version, server, macos-app, ios-app]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      - name: Choose the release notes
        id: notes
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          if [[ -f "releases/$V.md" ]]; then
            echo "path=releases/$V.md" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name:                ${{ needs.version.outputs.tag }}
          name:                    DJukebox ${{ needs.version.outputs.version }}
          draft:                   true
          body_path:               ${{ steps.notes.outputs.path }}
          generate_release_notes:  ${{ steps.notes.outputs.generate }}
          fail_on_unmatched_files: true
          files: |
            release-artifacts/server/djukebox-server-macos-${{ needs.version.outputs.version }}.tar.gz
            release-artifacts/macos-app/DJukebox-${{ needs.version.outputs.version }}.dmg
